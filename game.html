        <main>
            <table style="border:2px solid black;">
                <tr style="border:1px solid black;" height="100px">
                    <td id="a1" style="border:1px solid black;" width="100px"></td>
                    <td id="a2" style="border:1px solid black;" width="100px"></td>
                    <td id="a3" style="border:1px solid black;" width="100px"></td>
                </tr>
                <tr style="border:1px solid black;" height="100px">
                    <td id="b1" style="border:1px solid black;" width="100px"></td>
                    <td id="b2" style="border:1px solid black;" width="100px"></td>
                    <td id="b3" style="border:1px solid black;" width="100px"></td>
                </tr>
                <tr style="border:1px solid black;" height="100px">
                    <td id="c1" style="border:1px solid black;" width="100px"></td>
                    <td id="c2" style="border:1px solid black;" width="100px"></td>
                    <td id="c3" style="border:1px solid black;" width="100px"></td>
                </tr>
            </table>
            <button id="fly" onmousedown="dodge()">Click Me!</button>
        </main>
        <footer class="navbar-fixed-bottom">

        </footer>
        <script>
            var points = 0;
            function dodge(){
                var fly = document.getElementById("fly");
                var newLoc = parseInt((9*Math.random())+1);
                points++;
                if(newLoc==1){
                    document.getElementById("a1").appendChild(fly);
                }
                else if(newLoc==2){
                    document.getElementById("a2").appendChild(fly);
                }
                else if(newLoc==3){
                    document.getElementById("a3").appendChild(fly);
                }
                else if(newLoc==4){
                    document.getElementById("b1").appendChild(fly);
                }
                else if(newLoc==5){
                    document.getElementById("b2").appendChild(fly);
                }
                else if(newLoc==6){
                    document.getElementById("b3").appendChild(fly);
                }
                else if(newLoc==7){
                    document.getElementById("c1").appendChild(fly);
                }
                else if(newLoc==8){
                    document.getElementById("c2").appendChild(fly);
                }
                else if(newLoc==9){
                    document.getElementById("c3").appendChild(fly);
                }
                fly.innerHTML = "Points: " + points;
            }
        </script>
    </body>
